name: Publish a release
# When a new version folder arrives in incoming/, build the Windows installer from it and post the release.
on:
  push:
    branches: [main]
    paths: ['incoming/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and post any version not yet released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in incoming/*/; do
            V=$(basename "$dir")
            if gh release view "v$V" >/dev/null 2>&1; then continue; fi
            echo "Releasing $V"
            rm -rf out
            node build/make-installer.js "$V"
            gh release create "v$V" --target "$GITHUB_SHA" --title "Poker Night $V" --notes-file "incoming/$V/notes.md" out/*
          done

name: Publish a release
# Pushing a tag like v1.3.0 builds the Windows installer from incoming/1.3.0/ and posts the release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installer
        run: node build/make-installer.js "${GITHUB_REF_NAME#v}"
      - name: Post the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "Poker Night $V" --notes-file "incoming/$V/notes.md" out/*
